<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Proyek — S.R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/index2.css">
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="nav-overlay" id="navOverlay"></div>
  <nav>
    <a href="index.html" class="nav-logo">S.R<em style="font-style:normal;color:var(--gold)">.</em></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">Tentang</a></li>
      <li><a href="index.html#skills">Keahlian</a></li>
      <li><a href="index.html#projects">Proyek</a></li>
      <li><a href="index.html#contact">Kontak</a></li>
    </ul>
  </nav>

  <section class="detail-hero" id="detailHero">
    <a href="projects.html" class="back-link">&larr; Kembali ke Proyek</a>
    <p class="section-number" id="detailNum"></p>
    <h1 class="detail-title" id="detailTitle"></h1>
    <div class="project-stack" id="detailStack"></div>
  </section>

  <section class="detail-gallery" id="detailGallery"></section>

  <section class="detail-section">
    <div class="detail-content detail-content--full">
      <p class="section-number">Deskripsi</p>
      <p class="detail-body" id="detailDesc"></p>
    </div>
  </section>

  <section class="detail-section" id="roleSection">
    <div class="detail-role-grid">
      <div class="detail-role-left">
        <p class="section-number">Peran</p>
        <div class="detail-role-list" id="detailRole"></div>
      </div>
      <div class="detail-role-right">
        <p class="section-number">Kontribusi</p>
        <ul class="detail-contributions" id="detailContributions"></ul>
      </div>
    </div>
  </section>

  <section class="detail-section detail-bottom-cta">
    <a href="projects.html" class="btn-primary">&larr; Lihat Semua Proyek</a>
  </section>

  <!-- Lightbox Modal -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose" aria-label="Tutup">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Sebelumnya">&#10094;</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Selanjutnya">&#10095;</button>
    <div class="lightbox-content" id="lightboxContent"></div>
    <div class="lightbox-zoom-controls" id="lightboxZoomControls">
      <button class="lightbox-zoom-btn" id="lightboxZoomOut" aria-label="Zoom Out">&minus;</button>
      <span class="lightbox-zoom-level" id="lightboxZoomLevel">100%</span>
      <button class="lightbox-zoom-btn" id="lightboxZoomIn" aria-label="Zoom In">&plus;</button>
      <button class="lightbox-zoom-btn" id="lightboxZoomReset" aria-label="Reset Zoom" style="font-size:0.7rem;letter-spacing:0.08em">FIT</button>
    </div>
    <p class="lightbox-counter" id="lightboxCounter"></p>
  </div>

  <footer>
    <p class="footer-copy">&copy; 2026 Supriyandi Ridzkia. All rights reserved.</p>
    <p class="footer-made">Dirancang &amp; dibangun dengan <span>&hearts;</span> di Semesta ini</p>
  </footer>

  <script src="assets/js/projects.js"></script>
  <script src="assets/js/index2.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var id = parseInt(params.get('id'));
    var project = projects.find(function(p) { return p.id === id; });

    if (!project) {
      window.location.href = 'projects.html';
    } else {
      document.title = project.title + ' — S.R';
      document.getElementById('detailNum').textContent = project.num + ' — Proyek';
      document.getElementById('detailTitle').textContent = project.title;
      document.getElementById('detailDesc').textContent = project.fullDesc;

      // Populate Peran & Kontribusi
      var roleSection = document.getElementById('roleSection');
      if (project.role && project.role.length > 0 && project.contributions && project.contributions.length > 0) {
        var roleContainer = document.getElementById('detailRole');
        project.role.forEach(function(r) {
          var badge = document.createElement('span');
          badge.className = 'detail-role-badge';
          badge.textContent = r;
          roleContainer.appendChild(badge);
        });
        var contribList = document.getElementById('detailContributions');
        project.contributions.forEach(function(c) {
          var li = document.createElement('li');
          li.textContent = c;
          contribList.appendChild(li);
        });
      } else {
        roleSection.style.display = 'none';
      }

      var stackEl = document.getElementById('detailStack');
      project.stack.forEach(function(s) {
        var pill = document.createElement('span');
        pill.className = 'stack-pill';
        pill.textContent = s;
        stackEl.appendChild(pill);
      });

      var gallery = document.getElementById('detailGallery');
      var imageSources = [];

      function getImageSrc(n) {
        return 'assets/img/proyek/' + project.id + '/' + n + '.png';
      }

      // Dynamically probe images 1..20
      (function probeImage(n) {
        if (n > 20) return;
        var img = new Image();
        img.onload = function() {
          var index = imageSources.length;
          imageSources.push(img.src);

          var item = document.createElement('div');
          item.className = 'detail-gallery-item';
          item.setAttribute('data-index', index);
          item.setAttribute('role', 'button');
          item.setAttribute('tabindex', '0');
          item.setAttribute('aria-label', 'Lihat gambar ' + (index + 1));
          item.innerHTML =
            '<img class="pv-svg" src="' + img.src + '" alt="' + project.title + ' screenshot ' + (index + 1) + '" loading="lazy" />' +
            '<div class="gallery-hover-hint"><span>&#x1F50D;</span> Klik untuk memperbesar</div>';
          item.addEventListener('click', function() { openLightbox(index); });
          item.addEventListener('keydown', function(e) { if (e.key === 'Enter') openLightbox(index); });
          gallery.appendChild(item);
          probeImage(n + 1);
        };
        img.onerror = function() { /* stop probing */ };
        img.src = getImageSrc(n);
      })(1);

      // ===== LIGHTBOX LOGIC =====
      var lightboxOverlay = document.getElementById('lightboxOverlay');
      var lightboxContent = document.getElementById('lightboxContent');
      var lightboxCounter = document.getElementById('lightboxCounter');
      var lightboxClose = document.getElementById('lightboxClose');
      var lightboxPrev = document.getElementById('lightboxPrev');
      var lightboxNext = document.getElementById('lightboxNext');
      var lightboxZoomIn = document.getElementById('lightboxZoomIn');
      var lightboxZoomOut = document.getElementById('lightboxZoomOut');
      var lightboxZoomReset = document.getElementById('lightboxZoomReset');
      var lightboxZoomLevel = document.getElementById('lightboxZoomLevel');
      var currentIndex = 0;

      // ===== ZOOM STATE =====
      var zoomScale = 1;
      var zoomMinScale = 1;
      var zoomMaxScale = 5;
      var zoomStep = 0.25;
      var panX = 0;
      var panY = 0;
      var isDragging = false;
      var dragStartX = 0;
      var dragStartY = 0;
      var dragStartPanX = 0;
      var dragStartPanY = 0;

      function getImgEl() {
        return lightboxContent.querySelector('.lightbox-svg');
      }

      function updateZoomUI() {
        lightboxZoomLevel.textContent = Math.round(zoomScale * 100) + '%';
        var zoomed = zoomScale > 1.01;
        lightboxContent.classList.toggle('is-zoomed', zoomed);
      }

      function clampPan() {
        var img = getImgEl();
        if (!img || zoomScale <= 1) { panX = 0; panY = 0; return; }
        var cW = lightboxContent.clientWidth;
        var cH = lightboxContent.clientHeight;
        // Rendered size of image at scale 1
        var imgW = img.clientWidth;
        var imgH = img.clientHeight;
        // How much bigger the scaled image is than the container
        var overflowX = Math.max(0, (imgW * zoomScale - cW) / 2);
        var overflowY = Math.max(0, (imgH * zoomScale - cH) / 2);
        panX = Math.max(-overflowX, Math.min(overflowX, panX));
        panY = Math.max(-overflowY, Math.min(overflowY, panY));
      }

      function applyTransform() {
        var img = getImgEl();
        if (!img) return;
        img.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoomScale + ')';
        updateZoomUI();
      }

      function zoomAt(newScale, pivotX, pivotY) {
        // pivotX, pivotY are relative to the center of the container
        var oldScale = zoomScale;
        newScale = Math.max(zoomMinScale, Math.min(zoomMaxScale, newScale));
        if (newScale === oldScale) return;
        var ratio = newScale / oldScale;
        // Adjust pan so the point under the cursor stays fixed
        panX = pivotX - ratio * (pivotX - panX);
        panY = pivotY - ratio * (pivotY - panY);
        zoomScale = newScale;
        clampPan();
        applyTransform();
      }

      function zoomCenter(newScale) {
        zoomScale = Math.max(zoomMinScale, Math.min(zoomMaxScale, newScale));
        clampPan();
        applyTransform();
      }

      function resetZoom() {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        lightboxContent.classList.remove('is-zoomed', 'is-dragging');
        applyTransform();
      }

      // Mouse wheel zoom — zoom toward cursor
      lightboxContent.addEventListener('wheel', function(e) {
        e.preventDefault();
        var rect = lightboxContent.getBoundingClientRect();
        var px = e.clientX - rect.left - rect.width / 2;
        var py = e.clientY - rect.top - rect.height / 2;
        var delta = e.deltaY > 0 ? -zoomStep : zoomStep;
        zoomAt(zoomScale + delta, px, py);
      }, { passive: false });

      // Drag to pan (mouse)
      lightboxContent.addEventListener('mousedown', function(e) {
        if (zoomScale <= 1.01) return;
        e.preventDefault();
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartPanX = panX;
        dragStartPanY = panY;
        lightboxContent.classList.add('is-dragging');
      });

      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        panX = dragStartPanX + (e.clientX - dragStartX);
        panY = dragStartPanY + (e.clientY - dragStartY);
        clampPan();
        applyTransform();
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          lightboxContent.classList.remove('is-dragging');
        }
      });

      // Touch pinch-to-zoom & drag
      var touchStartDist = 0;
      var touchStartScale = 1;
      var singleTouchStart = null;

      lightboxContent.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          touchStartDist = Math.hypot(dx, dy);
          touchStartScale = zoomScale;
        } else if (e.touches.length === 1 && zoomScale > 1.01) {
          singleTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, px: panX, py: panY };
        }
      }, { passive: false });

      lightboxContent.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          var dist = Math.hypot(dx, dy);
          var newScale = touchStartScale * (dist / touchStartDist);
          zoomCenter(newScale);
        } else if (e.touches.length === 1 && singleTouchStart && zoomScale > 1.01) {
          e.preventDefault();
          panX = singleTouchStart.px + (e.touches[0].clientX - singleTouchStart.x);
          panY = singleTouchStart.py + (e.touches[0].clientY - singleTouchStart.y);
          clampPan();
          applyTransform();
        }
      }, { passive: false });

      lightboxContent.addEventListener('touchend', function() {
        singleTouchStart = null;
      });

      // Double-click to toggle zoom
      lightboxContent.addEventListener('dblclick', function(e) {
        if (zoomScale > 1.01) {
          resetZoom();
        } else {
          var rect = lightboxContent.getBoundingClientRect();
          var px = e.clientX - rect.left - rect.width / 2;
          var py = e.clientY - rect.top - rect.height / 2;
          zoomAt(2.5, px, py);
        }
      });

      // Zoom buttons
      lightboxZoomIn.addEventListener('click', function(e) {
        e.stopPropagation();
        zoomCenter(zoomScale + zoomStep);
      });

      lightboxZoomOut.addEventListener('click', function(e) {
        e.stopPropagation();
        zoomCenter(zoomScale - zoomStep);
      });

      lightboxZoomReset.addEventListener('click', function(e) {
        e.stopPropagation();
        resetZoom();
      });

      function openLightbox(index) {
        currentIndex = index;
        renderLightbox();
        lightboxOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightboxOverlay.classList.remove('active');
        document.body.style.overflow = '';
        resetZoom();
      }

      function renderLightbox() {
        var total = imageSources.length;
        resetZoom();
        lightboxContent.innerHTML = '<img class="lightbox-svg" src="' + imageSources[currentIndex] + '" alt="' + project.title + ' screenshot ' + (currentIndex + 1) + '" draggable="false" />';
        lightboxCounter.textContent = (currentIndex + 1) + ' / ' + total;
        lightboxPrev.style.display = total > 1 ? '' : 'none';
        lightboxNext.style.display = total > 1 ? '' : 'none';
      }

      function nextImage() {
        currentIndex = (currentIndex + 1) % imageSources.length;
        renderLightbox();
      }

      function prevImage() {
        currentIndex = (currentIndex - 1 + imageSources.length) % imageSources.length;
        renderLightbox();
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxPrev.addEventListener('click', function(e) { e.stopPropagation(); prevImage(); });
      lightboxNext.addEventListener('click', function(e) { e.stopPropagation(); nextImage(); });
      lightboxOverlay.addEventListener('click', function(e) {
        if (e.target === lightboxOverlay) closeLightbox();
      });
      document.addEventListener('keydown', function(e) {
        if (!lightboxOverlay.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === '+' || e.key === '=') zoomCenter(zoomScale + zoomStep);
        if (e.key === '-' || e.key === '_') zoomCenter(zoomScale - zoomStep);
        if (e.key === '0') resetZoom();
      });
    }
  </script>
</body>
</html>
